name: ci
# Microwave's OWN development CI (not shipped to adopters: the installers copy
# only gates.yml, a single-runner gate on the adopter's governed repo). Two jobs:
#   - lint: deterministic checks (ruff, codespell), run once.
#   - matrix: platform-sensitive checks (mypy, gates, tests) across every OS and
#     supported Python version, because Microwave is a cross-platform installer +
#     embodiment tool and a Windows-only green run once merged a Linux-red change.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint + spellcheck (deterministic, once)
        run: |
          pip install ruff==0.16.4 codespell==2.4.3
          ruff check .
          codespell

  matrix:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Wiki integrity
        run: python gates/gate_wiki.py
      - name: Anti-slop sweep
        run: python gates/gate_slop.py
      - name: Generated docs are fresh
        run: python gates/gate_docs.py
      - name: Typecheck (mypy, per-OS so platform issues surface)
        run: |
          pip install mypy==2.3.1
          mypy
      - name: Unit and integration tests (+ the optional property layer)
        run: |
          pip install hypothesis==6.165.10
          python -m unittest discover tests -v
      - name: All agent cards (active and staged)
        run: |
          set -e
          found=0
          for card in wiki/agents/*.md wiki/_staging/*.md; do
            [ -e "$card" ] || continue
            case "$card" in *README.md) continue;; esac
            found=1
            python gates/run_gates.py "$card"
          done
          [ "$found" = "1" ] || echo "no agent cards yet"
